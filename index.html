const parse=(s)=>new Date(s+'T00:00:00Z');const dateKey=(y,m,d)=>`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;const mStart=(i)=>{let m=10+i,y=state.fyStart;if(m>11){m-=12;y++}return [y,m]};const daysIn=(y,m)=>new Date(Date.UTC(y,m+1,0)).getUTCDate();const weekday=(s)=>{let d=parse(s).getUTCDay();return d>0&&d<6};const today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};

function localizeText(v){if(state.lang!=='zh')return v;let t=v.trim();if(!t)return v;let out=ZH[t];if(out===undefined){for(let [re,fn] of REPL){let match=t.match(re);if(match){out=fn(...match);break}}}if(out===undefined){out=t;for(let [en,cn] of LONG_ZH)out=out.replace(en,cn);if(out===t)return v}return v.replace(t,out)}
function localizePage(){document.documentElement.lang=state.lang==='zh'?'zh-CN':'en';const head=document.querySelector('#appTitle');if(head)head.textContent=state.lang==='zh'?'办公室出勤':'Office Attendance';document.querySelectorAll('[data-tab]').forEach(b=>b.textContent=state.lang==='zh'?({calendar:'月历',quarter:'季度',history:'年度',settings:'设置'}[b.dataset.tab]):({calendar:'Calendar',quarter:'Quarter',history:'Year',settings:'Settings'}[b.dataset.tab]));const f=document.querySelector('footer');if(f&&state.lang==='zh')f.innerHTML='记录仅存本机 · 清理浏览器数据前请先备份<br>V0.2 · 无需登录 · 无统计追踪 · 不联网同步';const pill=document.querySelector('#storagePill');if(pill)pill.textContent=state.lang==='zh'?'● 仅存本机':'● Local only';const root=document.querySelector('#content');const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let node;while(node=walker.nextNode()){if(node.parentElement?.closest('script,style'))continue;node.nodeValue=localizeText(node.nodeValue)}for(const e of root.querySelectorAll('input[placeholder],button[title]')){for(const a of ['placeholder','title']){if(e.hasAttribute(a))e.setAttribute(a,localizeText(e.getAttribute(a)))}}}
function render(){renderBase();localizePage()}

function saveSettings(){let rate=Number(document.querySelector('#rate').value);if(!Number.isFinite(rate)||rate<0||rate>100){alert('Percentage must be between 0 and 100.');return}state.rate=rate;state.country=document.querySelector('#country').value;state.region=state.country==='MY'?document.querySelector('#region').value:REGIONS[state.country][0];state.lang=document.querySelector('#lang').value;state.basis=document.querySelector('#basis').value;state.fyStart=Number(document.querySelector('#fyStart').value);idx=1;persist();render()}
function download(name,content,type){let b=new Blob([content],{type}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
const csvEsc=x=>'"'+String(x).replace(/"/g,'""')+'"';
function exportCsv(){let head=['Date','Fiscal Year','Quarter','Month','Attended','Holiday name','Make-up workday','Country','Region','Required %'];let rows=[head.join(',')];for(let i=0;i<12;i++){let st=stats(i);for(let d=1;d<=daysIn(st.y,st.m);d++){let k=dateKey(st.y,st.m,d);rows.push([k,state.fyStart+1,Math.floor(i/3)+1,NAMES[st.m],att(k)?1:0,holiday(k),isMakeup(k)?1:0,state.country,state.region,state.rate].map(csvEsc).join(','))}}download(`attendance_FY${state.fyStart+1}.csv`,'\ufeff'+rows.join('\r\n'),'text/csv;charset=utf-8')}
function exportHtml(){
 const exported=new Date().toLocaleString();
 const qs=Array.from({length:4},(_,q)=>qstats(q));
 const all=Array.from({length:12},(_,i)=>stats(i));
 const css=document.querySelector('style').textContent;
 let contents='';
 for(const q of qs){
   let inner='';
   for(const m of q.months){
     inner+=`<div class="monthrow"><div class="row"><strong>${NAMES[m.m]} ${m.y}</strong><span>${m.actual}/${m.required}</span></div><div class="detail">${m.ds.map(d=>Number(d.slice(-2))+' '+NAMES[m.m].slice(0,3)).join(', ')||'No attendance recorded'}</div></div>`;
   }
   contents+=`<div class="card"><div class="row"><h3>Q${q.q+1}</h3><strong>${q.actual}/${q.required}</strong></div>${progress(q.actual,q.required)}${inner}</div>`;
 }
 const options=all.map((m,i)=>`<option value="${i}">${NAMES[m.m]} ${m.y}</option>`).join('');
 const rows=all.map(m=>({y:m.y,m:m.m,ds:m.ds,holidays:Array.from({length:daysIn(m.y,m.m)},(_,j)=>{const k=dateKey(m.y,m.m,j+1);return [k,holiday(k),isMakeup(k)]}).filter(x=>x[1]||x[2])}));
 const viewerJs=`const data=${JSON.stringify(rows).replace(/</g,'\\u003c')};
 function showMonth(i){
 let m=data[Number(i)],n=new Date(Date.UTC(m.y,m.m+1,0)).getUTCDate(),pad=(new Date(Date.UTC(m.y,m.m,1)).getUTCDay()+6)%7;
 let html=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>'<div class="dow">'+d+'</div>').join('');
 for(let j=0;j<pad;j++)html+='<div></div>';
 for(let d=1;d<=n;d++){
 let k=m.y+'-'+String(m.m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
 let hol=m.holidays.find(x=>x[0]===k),att=m.ds.includes(k),w=new Date(Date.UTC(m.y,m.m,d)).getUTCDay();
 html+='<div class="day '+(att?'attended':hol&&hol[1]?'holiday':hol&&hol[2]?'makeup':w===0||w===6?'weekend':'')+'"><span>'+d+'</span><span class="small">'+(att?'✓':hol&&hol[1]?'PH':hol&&hol[2]?'Work':'')+'</span></div>';
 }
 document.querySelector('#viewerCal').innerHTML=html;
 document.querySelector('#viewerHolidays').textContent=m.holidays.map(x=>Number(x[0].slice(-2))+' '+(x[1]||'Make-up workday')).join(' · ');
 }showMonth(0);`;
 const snapshot='<!doctype html><html lang="'+(state.lang==='zh'?'zh-CN':'en')+'">'+'<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Attendance Read-only</title><style>'+css+'</style></head><body><main class="app"><header class="head"><div><div class="eyebrow">Read-only · Exported '+h(exported)+'</div><h1>Office Attendance · FY'+(state.fyStart+1)+'</h1></div><span class="pill">Read only</span></header><div class="card"><div class="row"><strong>'+h(state.country)+' · '+h(state.region)+'</strong><span>'+state.rate+'% target</span></div><div class="note">Phone is source of truth. This file cannot update or sync records.</div></div>'+contents+'<div class="card"><h3>Monthly Calendar</h3><select id="pickMonth" onchange="showMonth(this.value)" style="padding:10px;border-radius:8px;border:1px solid #ddd;width:100%">'+options+'</select><div class="cal" id="viewerCal" style="margin-top:12px"></div><div id="viewerHolidays" class="detail" style="margin-top:12px"></div></div><footer>Offline HTML snapshot · '+h(exported)+'</footer></main><script>'+viewerJs+'</scr'+'ipt></body></html>';
 download(`attendance_FY${state.fyStart+1}_read_only.html`,snapshot,'text/html;charset=utf-8');
}
function makeExport(type){if(type==='html')exportHtml();else if(type==='csv')exportCsv();else download(`attendance_FY${state.fyStart+1}_backup.json`,JSON.stringify({format:'office-attendance-backup-v1',exportedAt:new Date().toISOString(),state},null,2),'application/json')}
async function restoreFile(file){if(!file)return;try{let x=JSON.parse(await file.text());if(x.format!=='office-attendance-backup-v1'||!x.state||!Array.isArray(x.state.dates))throw Error('Invalid backup format');if(!confirm('Restore JSON and REPLACE local records/settings on this device?'))return;state={...defaults(),...x.state};persist();render();alert('Backup restored successfully.')}catch(e){alert('Import failed: '+e.message)}}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;render()}else if(b.dataset.prev){idx--;render()}else if(b.dataset.next){idx++;render()}else if(b.dataset.day){let k=b.dataset.day;if(!eligible(k)){alert((holiday(k)||'Weekend')+' — not an eligible office day.');return}if(k>today()){alert('Future date: you can only check in on or before today.');return}state.dates=att(k)?state.dates.filter(x=>x!==k):[...state.dates,k].sort();persist();render()}else if(b.dataset.save)saveSettings();else if(b.dataset.export)makeExport(b.dataset.export);else if(b.dataset.addholiday||b.dataset.addwork||b.dataset.removeoverride){let dt=document.querySelector('#overrideDate').value,nam=document.querySelector('#holidayName').value.trim();if(!dt){alert('Select a date.');return}if(b.dataset.addholiday){if(!nam){alert('Enter a holiday name.');return}state.extraHolidays[dt]=nam;state.extraWorkdays=state.extraWorkdays.filter(x=>x!==dt)}if(b.dataset.addwork){state.extraWorkdays=[...new Set([...state.extraWorkdays,dt])];delete state.extraHolidays[dt]}if(b.dataset.removeoverride){delete state.extraHolidays[dt];state.extraWorkdays=state.extraWorkdays.filter(x=>x!==dt)}persist();render()}});
document.addEventListener('change',e=>{if(e.target.id==='country'){let c=e.target.value;document.querySelector('#region').innerHTML=REGIONS[c].map(v=>`<option>${v}</option>`).join('');document.querySelector('#regionGroup').style.display=c==='MY'?'':'none'}if(e.target.id==='importfile')restoreFile(e.target.files?.[0])});
render();if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
</script></body></html>
